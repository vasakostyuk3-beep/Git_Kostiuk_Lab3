
name: Lab3 GitHub Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check laboratory files
        run: |
          test -f README.md
          test -f LICENSE
          test -f lab3.txt
          echo "Laboratory work 3 - OK"
  
